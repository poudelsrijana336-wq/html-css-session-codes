<body>
    <h1>Student Registration form</h1>
    <form>
    <label>Name:</label>
    <input type="text" placeholder="Enter your name"><BR><BR>

    <label>Password:</label>
    <input type="password" placeholder="Password"><BR><BR>

    <label>Email:</label> 
    <input type="email" id="email" placeholder="Enter email"><BR><BR>

    <label>Phone Number:</label>
    <input type="number" placeholder="Enter your phone no."><BR><BR>

    <label>Date of Birth:</label>
    <input type="date"><BR><br>
        <label>Message/Feedback/Bio/Caption</label><br><br>
        <textarea placeholder="Enter message/feedback/bio/caption" rows="10" cols="50"></textarea><br>

        <!--Checkbox-->
        <label>Hobbies</label><br>
        <input type="checkbox" value="cricket"> Cricket
        <input type="checkbox" value="football"> Football
        <input type="checkbox" value="singing"> Singing
        <input type="checkbox" value="chess"> Chess<br><br>

        <!--Radio Button-->

        <input type="radio" value="male" name="gender"> Male

        <button>Login</button>
        <button>Register</button><br><br>
